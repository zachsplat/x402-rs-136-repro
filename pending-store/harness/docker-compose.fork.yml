# Anvil fork of Base Sepolia: anvil, the fault proxy in front of it, the x402-rs facilitator
# under test (its only RPC is the proxy) and the resource server on the reference SDK. Ports on
# 127.0.0.1 only: 19450 anvil, 19451 proxy, 19452 facilitator, 19453 server. Run through
# fork_up.sh and fork_down.sh.
services:
  anvil:
    image: ${ANVIL_IMAGE:-ghcr.io/foundry-rs/foundry:v1.8.1}
    entrypoint: ["anvil"]
    command:
      - --host=0.0.0.0
      - --port=8545
      - --fork-url=${FORK_URL:-https://sepolia.base.org}
      - --block-time=2
      - --chain-id=84532
    ports:
      - "127.0.0.1:19450:8545"
  proxy:
    image: python:3.12-alpine
    user: "${HOST_UID_GID:-1000:1000}"
    command: ["python", "-u", "/fault_proxy.py"]
    environment:
      UPSTREAM: http://anvil:8545
      PROXY_LOG: /logs/proxy.log
    volumes:
      - ./fault_proxy.py:/fault_proxy.py:ro
      - ${RUN_DIR:?RUN_DIR}:/logs
    ports:
      - "127.0.0.1:19451:8546"
    depends_on: [anvil]
    healthcheck:
      test: ["CMD", "python", "-c", "import json, urllib.request as u; r = u.urlopen(u.Request('http://127.0.0.1:8546', data=b'{\"jsonrpc\":\"2.0\",\"id\":1,\"method\":\"eth_blockNumber\",\"params\":[]}', headers={'Content-Type': 'application/json'}), timeout=5); assert 'result' in json.loads(r.read())"]
      interval: 2s
      timeout: 8s
      retries: 60
  facilitator:
    image: ${FACILITATOR_IMAGE:?FACILITATOR_IMAGE}
    command: ["--config", "/config.json"]
    environment:
      RUST_LOG: info
      XD_FACILITATOR_SIGNER: ${XD_FACILITATOR_SIGNER:?XD_FACILITATOR_SIGNER}
    volumes:
      - ./config/${FACILITATOR_CONFIG:-facilitator-fork.json}:/config.json:ro
    ports:
      - "127.0.0.1:19452:8080"
    depends_on:
      proxy:
        condition: service_healthy
  server:
    image: node:22-bookworm-slim
    user: "${HOST_UID_GID:-1000:1000}"
    working_dir: /app
    command: ["node", "--import", "tsx", "src/server.ts"]
    environment:
      HOME: /tmp
      XD_PAY_TO: ${XD_PAY_TO:?XD_PAY_TO}
      XD_FACILITATOR_URL: http://facilitator:8080
      XD_NETWORK: eip155:84532
      XD_PORT: "4021"
      XD_LOG: /logs/server.log
    volumes:
      - ../app:/app:ro
      - ${RUN_DIR:?RUN_DIR}:/logs
    ports:
      - "127.0.0.1:19453:4021"
    depends_on: [facilitator]
